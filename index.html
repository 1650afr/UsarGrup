<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123f35"><title>UsarGrup</title>
<link rel="stylesheet" href="./styles.css?v=2.3.1">
</head>
<body>
<header class="topbar"><div class="brand">U</div><div><h1>UsarGrup</h1><p>Administrasi dan pembinaan UPA</p></div><span class="version">v2.3.1</span></header>
<main class="wrap">
<section id="auth" class="panel auth">
<p class="eyebrow">SELAMAT DATANG</p><h2>Masuk ke UsarGrup</h2>
<div class="tabs"><button id="showLogin" class="tab active">Masuk</button><button id="showRegister" class="tab">Daftar</button></div>
<form id="loginForm"><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"><label>Kata sandi</label><input id="loginPassword" type="password" required autocomplete="current-password"><button class="primary">Masuk</button><button type="button" id="forgot" class="link">Lupa kata sandi?</button></form>
<form id="registerForm" hidden><label>Nama lengkap</label><input id="regName" required><label>Email</label><input id="regEmail" type="email" required><label>Kata sandi (minimal 8 karakter)</label><input id="regPassword" type="password" minlength="8" required><button class="primary">Daftar</button></form>
<p id="authMsg" class="message"></p></section>
<section id="app" hidden>
<div class="welcome panel"><div><p class="eyebrow">BERANDA</p><h2 id="hello">Assalamu'alaikum</h2><p id="who" class="muted"></p><p id="roleText" class="muted"></p></div><button id="logout" class="secondary">Keluar</button></div>
<div id="pending" class="panel" hidden>Akun Anda menunggu verifikasi Admin Utama.</div>
<section id="dashboard" class="panel">
<div class="dashhead"><div><p class="eyebrow">RUANG KERJA UPA</p><h2>Menu Utama</h2><p class="muted">Pilih modul yang ingin dibuka.</p></div></div>
<div id="menu" class="menu-grid"></div>
</section>
<section id="view" class="panel" hidden><div class="viewhead"><div><p class="eyebrow">MODUL USARGRUP</p><h2 id="viewTitle">Modul</h2></div><button id="back" class="secondary">← Beranda</button></div><div id="viewBody"></div></section>
</section>
</main><footer>UsarGrup • by Muhajir, ST • v2.3.1</footer>
<script type="module" src="./app.js?v=2.3.1"></script>
</body></html>
